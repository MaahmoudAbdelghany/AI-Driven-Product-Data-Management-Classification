[project]
name = "ai-product-data-management"
version = "0.1.0"
description = "AI-Driven Product Data Management & Classification — transforms messy bilingual product data into clean, categorized, searchable datasets using LLM-powered pipelines on AWS."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Mahmoud Abdelghany" },
]

dependencies = [
    # --- Core Pipeline ---
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # --- AWS ---
    "boto3>=1.34.0",
    "botocore>=1.34.0",

    # --- NLP / Text Processing ---
    "langdetect>=1.0.9",
    "rapidfuzz>=3.9.0",
    "regex>=2024.5.0",

    # --- Web Scraping ---
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "lxml>=5.2.0",

    # --- Data Export ---
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
app = [
    # --- Streamlit UI ---
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "altair>=5.3.0",
]
infra = [
    # --- AWS CDK ---
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.3.0",
]
dev = [
    # --- Testing ---
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "moto[s3,dynamodb,stepfunctions]>=5.0.0",

    # --- Linting / Formatting ---
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring AWS credentials (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
